# Builds in-cluster on kampascluster and pushes to the in-cluster registry.
# Flux image automation then bumps the tag in kampascluster's
# kubernetes/apps/ninerouter/ — no tokens, no cross-repo commits from CI.
#
# Only the "adapted" branch (master stays a pure mirror of upstream
# decolua/9router for rebasing) — see kubernetes/apps/ninerouter/README.md
# in kampascluster for the update workflow.
when:
  branch: adapted
  event: push

steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx
    privileged: true    # requires this repo marked "Trusted" by the Woodpecker admin
    settings:
      registry: registry.registry.svc.cluster.local:5000
      repo: registry.registry.svc.cluster.local:5000/ninerouter
      tags: ${CI_PIPELINE_NUMBER}
      insecure: true
      config: |
        {"insecure-registries": ["registry.registry.svc.cluster.local:5000"]}
      # output: type=docker is required, not an optimization — see
      # kampascluster/docs/woodpecker-pipeline-example.yml for why.
      output: type=docker
      # The docker-container buildx driver creates its own bridge network
      # for the nested buildkit container, defaulting to MTU 1500 -- which
      # doesn't match this cluster's Flannel VXLAN overlay (1450, 50 bytes
      # of encapsulation overhead). Small requests (DNS, small HTTP
      # responses) succeed; larger transfers (apk/npm package downloads)
      # connect, then silently hang forever at zero CPU -- confirmed live
      # (2026-09-20): a RUN step stuck 48+ minutes on
      # `apk add python3 make g++ linux-headers`, while the outer CI pod
      # reached the same host fine. `mtu` here becomes `dockerd --mtu`,
      # which sets the default MTU Docker uses for every network it
      # creates, including buildx's nested one.
      #
      # (buildkit_driveropt: network=host was tried first and had no
      # effect -- the deployed plugin image's `docker buildx create`
      # never received a --driver-opt flag despite that setting existing
      # in the plugin's current source, so either an older image is
      # pinned or something else strips it. `mtu` is the daemon-level
      # setting instead, one layer earlier and confirmed to reach
      # `dockerd` via `debug: true` below.)
      mtu: "1450"
      debug: true
